name: Deploy

on:
  push:
    branches: [main]        # -> dev
    tags: ["v*"]            # -> prod (with approval)
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [dev, prod]

permissions:
  id-token: write   # OIDC to AWS
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_API: commerceos/api
  ECR_FRONTEND: commerceos/frontend

jobs:
  build-push:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      has_aws: ${{ steps.check-aws.outputs.configured }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - name: Check AWS credentials
        id: check-aws
        env:
          AWS_ROLE: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        run: |
          if [ -n "$AWS_ROLE" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "AWS_DEPLOY_ROLE_ARN is not configured; skipping AWS operations."
          fi
      - uses: aws-actions/configure-aws-credentials@v4
        if: steps.check-aws.outputs.configured == 'true'
        continue-on-error: true
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
        if: steps.check-aws.outputs.configured == 'true'
        id: ecr
      - name: Build & push API
        if: steps.check-aws.outputs.configured == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_API }}:${{ steps.meta.outputs.tag }}
      - name: Build & push frontend
        if: steps.check-aws.outputs.configured == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_API_BASE_URL=${{ vars.API_BASE_URL }}
            VITE_WS_BASE_URL=${{ vars.WS_BASE_URL }}
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_FRONTEND }}:${{ steps.meta.outputs.tag }}

  deploy:
    needs: build-push
    if: needs.build-push.outputs.has_aws == 'true'
    runs-on: ubuntu-latest
    environment: ${{ (startsWith(github.ref, 'refs/tags/v') && 'prod') || 'dev' }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        continue-on-error: true
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Run DB migrations (one-shot ECS task)
        run: |
          aws ecs run-task --cluster commerceos-${{ job.environment }} \
            --task-definition commerceos-migrate-${{ job.environment }} \
            --launch-type FARGATE --network-configuration "$(cat infra/aws/envs/${{ job.environment }}/netcfg.json)" \
            --overrides '{"containerOverrides":[{"name":"migrate","environment":[{"name":"IMAGE_TAG","value":"${{ needs.build-push.outputs.tag }}"}]}]}'
      - name: Update services
        run: |
          for svc in api worker frontend; do
            aws ecs update-service --cluster commerceos-${{ job.environment }} \
              --service commerceos-$svc-${{ job.environment }} --force-new-deployment
          done
          aws ecs wait services-stable --cluster commerceos-${{ job.environment }} \
            --services commerceos-api-${{ job.environment }} commerceos-worker-${{ job.environment }}
      - name: Smoke test
        run: |
          curl -fsS "${{ vars.PUBLIC_URL }}/health" || exit 1
          curl -fsS "${{ vars.PUBLIC_URL }}/api/v1/health/ready" || exit 1
      - name: Rollback on failure
        if: failure()
        run: |
          for svc in api worker frontend; do
            aws ecs update-service --cluster commerceos-${{ job.environment }} \
              --service commerceos-$svc-${{ job.environment }} \
              --task-definition "$(aws ecs describe-services --cluster commerceos-${{ job.environment }} \
                --services commerceos-$svc-${{ job.environment }} \
                --query 'services[0].deployments[1].taskDefinition' --output text)"
          done
