name: Deploy to EC2 (Free Tier)

# CI/CD for the single-EC2, Free-Tier-first deployment path — see
# docs/deploy-aws-free-tier.md. This is a *different* target than
# deploy.yml/infra.yml (which ship to the ECS/Fargate/ALB stack in
# infra/aws/ — not Free Tier eligible). Use this workflow if you followed
# the EC2 guide; use deploy.yml/infra.yml if you provisioned infra/aws/
# instead. Don't run both against the same environment.
#
# On every push to main: SSH into the instance, pull, rebuild, restart.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ec2-free-tier
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 60s
          command_timeout: 15m
          script: |
            set -e
            cd ~/CommerceOS
            git fetch origin main
            git reset --hard origin/main
            docker compose -f docker-compose.aws.yml --env-file .env.aws up -d --build
            docker image prune -f

      - name: Smoke test
        run: |
          curl -fsS --retry 6 --retry-delay 10 "http://${{ secrets.EC2_HOST }}:8000/health"
          curl -fsS --retry 3 --retry-delay 5 "http://${{ secrets.EC2_HOST }}/"
          echo "Deploy OK: http://${{ secrets.EC2_HOST }}"
