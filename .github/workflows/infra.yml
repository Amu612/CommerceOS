name: Infra (Terraform)

# Provisions/updates the AWS infra `deploy.yml` ships images onto: VPC, ECR,
# RDS, ElastiCache, ALB, the ECS cluster/services/task-def *templates*, IAM,
# Secrets Manager, CloudWatch. See infra/aws/README.md for the one-time
# bootstrap this depends on (infra/aws/bootstrap — remote state + OIDC role).
#
# `plan` runs on every PR that touches infra/aws/** so reviewers see the
# diff before merge. `apply` is manual only (workflow_dispatch), and the
# `prod` GitHub Environment should have a required reviewer configured so a
# prod apply always pauses for a second pair of eyes.

on:
  pull_request:
    paths: ["infra/aws/**"]
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        description: Target environment
        options: [dev, prod]
        required: true
      action:
        type: choice
        description: Terraform action
        options: [plan, apply]
        default: plan

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  AWS_REGION: us-east-1
  TF_VERSION: "1.9.8"
  TF_IN_AUTOMATION: "true"

jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [dev]
    defaults:
      run:
        working-directory: infra/aws/envs/${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ vars.TF_STATE_REGION || env.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ vars.TF_STATE_LOCK_TABLE }}"

      - name: Terraform validate + plan
        id: plan
        env:
          TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
          TF_VAR_domain_name: ${{ vars.DOMAIN_NAME || '' }}
          TF_VAR_acm_certificate_arn: ${{ vars.ACM_CERTIFICATE_ARN || '' }}
          TF_VAR_groq_api_key: ${{ secrets.GROQ_API_KEY }}
          TF_VAR_openai_api_key: ${{ secrets.OPENAI_API_KEY }}
        run: |
          terraform fmt -check -recursive ../../
          terraform validate
          terraform plan -input=false -no-color -out=tfplan | tee plan.txt

      - name: Comment plan on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('infra/aws/envs/${{ matrix.environment }}/plan.txt', 'utf8').slice(-60000);
            const body = `#### Terraform plan — \`${{ matrix.environment }}\`\n<details><summary>Show plan</summary>\n\n\`\`\`\n${plan}\n\`\`\`\n</details>`;
            const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: context.issue.number });
            const mine = comments.find(c => c.user.type === 'Bot' && c.body.startsWith(`#### Terraform plan — \`${{ matrix.environment }}\``));
            if (mine) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }

  apply:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: infra/aws/envs/${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ vars.TF_STATE_REGION || env.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ vars.TF_STATE_LOCK_TABLE }}"

      - name: Terraform plan / apply
        env:
          TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
          TF_VAR_domain_name: ${{ vars.DOMAIN_NAME || '' }}
          TF_VAR_acm_certificate_arn: ${{ vars.ACM_CERTIFICATE_ARN || '' }}
          TF_VAR_llm_provider: ${{ vars.LLM_PROVIDER || '' }}
          TF_VAR_groq_api_key: ${{ secrets.GROQ_API_KEY }}
          TF_VAR_openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          TF_VAR_anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          terraform validate
          if [ "${{ inputs.action }}" = "apply" ]; then
            terraform apply -input=false -auto-approve
          else
            terraform plan -input=false -no-color
          fi
